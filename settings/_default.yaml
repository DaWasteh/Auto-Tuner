display_name: "Generic / fallback"
patterns: []

max_context: 8192
recommended_kv_quant: q4_0

# Sampling-Profile pro Modus.
# Die GUI-Dropdown wählt zwischen "chat" (default) und "coding".
sampling:
  chat:
    temperature: 0.7
    top_k: 40
    top_p: 0.95
    min_p: 0.05
    repeat_penalty: 1.05
  coding:
    temperature: 0.2
    top_k: 40
    top_p: 0.9
    min_p: 0.05
    repeat_penalty: 1.05

notes: >
  Fallback profile. It is used whenever no specific profile matches. Chat
  defaults are deliberately conservative (temp 0.7); coding is clearly more
  deterministic (temp 0.2). Model-specific YAML files override this.
