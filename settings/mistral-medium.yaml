display_name: "Mistral Medium 3.x"
patterns:
  - mistral-medium

# Mistral Medium 3.5 (Release 29.04.2026): dense 128B, 256k Kontext.
# Vorgänger Medium 3.1 hatte ebenfalls 256k.
max_context: 262144
recommended_kv_quant: q8_0

# Sampling-Profile pro Modus.
sampling:
  chat:
    # Mistral's offizielle Empfehlung:
    #   reasoning_effort="high"  -> temp=0.7
    #   reasoning_effort="none"  -> temp=0.0 bis 0.7 (task-abhängig)
    # 0.7 ist der saubere Default für beide Modi im Chat-Kontext.
    temperature: 0.7
    top_k: 40
    top_p: 0.95
    min_p: 0.0
    # WICHTIG: Mistral sagt "Keep repetition and presence penalties disabled
    # or at 1.0 unless you see looping" - höhere Penalty kann die
    # Output-Qualität reduzieren.
    repeat_penalty: 1.0
  coding:
    # Für reines Coding ohne Reasoning empfiehlt Mistral selbst
    # temp=0.0 bis 0.7. 0.2 ist der Sweet-Spot für agentisches
    # Code-Editing (Vibe CLI nutzt ähnliche Werte).
    temperature: 0.2
    top_k: 40
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0

notes: >
  Mistral Medium 3.5 (128B dense, multimodal text+image, 29 April 2026) is
  Mistral's first unified model, replacing Medium 3.1, Magistral AND Devstral
  2 in one (Mistral itself: "supersedes all our previous coding models, namely
  Devstral, across all benchmarks"). Hybrid reasoning with per-request
  configurable reasoning_effort (none/high). Modified MIT License. Vibe CLI
  (Mistral's coding agent) now runs on Medium 3.5 instead of Devstral 2.
  Locally: ~64 GB RAM for UD-Q4_K_XL via llama.cpp. Chat profile = Mistral's
  default (temp 0.7, works for both reasoning modes). Coding profile = more
  deterministic (temp 0.2) for agentic code tasks. Enable reasoning mode via:
  -- --chat-template-kwargs '{"reasoning_effort":"high"}'. IMPORTANT: use
  GGUFs from 1 May 2026 or newer; earlier versions had a YaRN bug
  (mscale_all_dim) that ruined long-context performance (Mistral itself
  confirmed that the original Transformers config had a long-context
  performance bug). At Unsloth the fixed build is called, for example,
  UD-Q4_K_XL.
