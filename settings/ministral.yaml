display_name: "Ministral 3 (Mistral, reasoning)"
patterns:
  - ministral

# Mistral docs: Ministral 3 (3B/8B/14B) hat 256k Kontext, alle Varianten.
# vLLM-Default ist 262144.
max_context: 262144
recommended_kv_quant: q8_0

# Sampling-Profile pro Modus.
sampling:
  chat:
    # Mistral's offizielle Empfehlung für die Reasoning-Variante:
    # "Use a temperature of 1 for most environments" (HF GGUF Card).
    # Für die Instruct-Variante würde Mistral <0.1 empfehlen - falls
    # dein Model-Filename "Instruct" enthält statt "Reasoning", den
    # Coding-Modus verwenden oder per CLI überschreiben.
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    min_p: 0.05
    repeat_penalty: 1.0
  coding:
    # Für Coding-Tasks UND für die Instruct-Varianten von Ministral 3.
    # Mistral nennt für Instruct <0.1 als Default - 0.15 ist der
    # praktische Sweet-Spot zwischen Determinismus und brauchbarer
    # Output-Vielfalt.
    temperature: 0.15
    top_k: 40
    top_p: 0.95
    min_p: 0.05
    repeat_penalty: 1.0

notes: >
  Ministral 3 (3B/8B/14B), Mistral's edge family, all with vision (mmproj).
  The 14B Reasoning variant is comparable to Mistral Small 3.2 24B in
  reasoning benchmarks (85% AIME '25). The architecture shares RoPE scaling
  with Devstral Small 2 / Llama 4. Apache 2.0. Chat profile = Reasoning
  variant (temp 1.0, Mistral recommendation). The coding profile also suits
  the Instruct variants (temp ~0.1). Note: the pattern matches all variants;
  for Instruct models simply use coding mode for chat as well, or override via
  CLI: -- --temp 0.0
