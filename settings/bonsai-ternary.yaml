display_name: "Ternary-Bonsai (PrismML, 1.58-bit)"
patterns:
  - ternary-bonsai

# Wie Bonsai 8B - 64k ist eine vernünftige Obergrenze.
max_context: 65536
recommended_kv_quant: q8_0

# Braucht ebenfalls den PrismML-Fork - Q2_0 Format packt die 1.58-bit
# Ternary-Gewichte hardware-freundlich in 2 bits. Der 2-bit/Ternary-Fork
# heisst 2b_ (Builds: 2b_bXXXX_vulkan_llama.cpp / _hip_llama.cpp);
# 1b_ ist der 1-bit Bonsai-Fork. Der Profilhinweis bleibt backend-neutral.
server_binary: "2b_llama/llama-server"

# Sampling-Profile pro Modus.
# Gleiche Empfehlung wie Bonsai 8B (PrismML README-Beispiel).
sampling:
  chat:
    temperature: 0.5
    top_k: 20
    top_p: 0.85
    min_p: 0.05
    repeat_penalty: 1.05
  coding:
    # Wie bei 1-bit Bonsai: nur leicht abgesenkt, weil aggressive Quants
    # bei niedriger Temperatur zu Loops tendieren.
    temperature: 0.3
    top_k: 20
    top_p: 0.85
    min_p: 0.05
    repeat_penalty: 1.05

notes: >
  Ternary-Bonsai (8B/4B/1.7B): weights in {-1, 0, +1} (1.58 bits per weight).
  Between 1-bit Bonsai and full precision: about 9x smaller, 5x faster, and
  better on benchmarks than 1-bit Bonsai (avg +5 points). Q2_0 is the storage
  format used (2-bit aligned for Metal/CUDA). Requires the PrismML
  2b_llama.cpp fork (ternary kernels, 2-bit Q2_0).
