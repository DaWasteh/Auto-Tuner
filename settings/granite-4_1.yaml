display_name: "Granite 4.1 (IBM)"
patterns:
  - granite-4.1
  - granite4.1
  - granite-4-1

# 8B/30B support 524288 (512k); 3B only 131072 (128k). GGUF metadata
# automatically clamps each checkpoint. Granite Switch is a separate profile.
max_context: 524288
recommended_kv_quant: q8_0

sampling:
  chat:
    temperature: 0.7
    top_k: 40
    top_p: 0.9
    min_p: 0.05
    repeat_penalty: 1.0
  coding:
    temperature: 0.0
    top_k: 0
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0

notes: >
  Dense decoder-only Transformer (3B/8B/30B), not a reasoning model.
  Strong in tool calling, instruction following, RAG, and coding. The 3B
  checkpoint supports 128k context; 8B and 30B support up to 512k. Granite
  Switch 4.1 is intentionally separate because it uses the dedicated
  graniteswitch architecture and requires a newer llama.cpp build. Apache
  2.0 license. Do not use CUDA 13.2 because it can produce gibberish; this
  warning does not affect Vulkan on AMD.
