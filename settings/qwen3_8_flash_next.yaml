display_name: "Qwen3.8 Flash Next (Alibaba)"
patterns:
  - qwen3.8-flash-next
  - qwen3_8_flash_next
  - qwen38-flash-next
  - qwen3.8 flash next
  - qwen4-exp
  - qwen4moe
arch_fallback:
  - qwen4exp

# qwen4exp reached stock llama.cpp in b10660 (PR #27742). Unlike ordinary
# option compatibility, model-loader support cannot be inferred from --help.
min_llama_build: 10660

# The supplied GGUF metadata is authoritative for this checkpoint:
# qwen4exp.context_length=262144, 48 blocks, and full attention every fourth
# block. Do not inherit the separate Qwen3.8 27B/2.4T profile's optional 1M
# YaRN claim until the Flash-Next model/runtime publishes that contract.
max_context: 262144
recommended_kv_quant: q4_0

rope_scale:
  enabled: false
  max_context: 262144
  scale_factor: 1.0

# The PLE/QSA model is already decode-efficient; default to the 64-token
# ubatch tier so long-context capacity wins over a marginal batch increase.
performance_target: safe

# Metadata-embedded generation defaults.
sampling:
  chat:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja
  - --reasoning-preserve

# PLE is a model-native per-layer n-gram embedding table, not an ordinary MTP
# head. Generic n-gram speculation remains optional and must not be mislabeled
# as --spec-type draft-mtp.
draft_max: 2
draft_p_min: 0.75
ngram_method: ngram-map-k4v

notes: >
  Dedicated profile for Qwen3.8-Flash-Next GGUFs declaring qwen4exp. Mainline
  llama.cpp supports the loader from b10660. The model has 48 hybrid MoE blocks,
  512 experts with 10 active, full attention every fourth block (12 normal KV
  layers), an additional QSA indexer cache, and 262,144 native context. Its PLE
  per-layer n-gram embedding table is a giant read-lazy host mapping rather than
  splittable layer weight; AutoTuner sizes the full file mapping separately
  from its active-row residency and defaults this profile to Safe/ubatch 64.
  Balanced/Throughput remain available at ubatch 128/256 because the QSA graph
  grows with context x ubatch. PLE is not advertised as
  generic draft-mtp.
