display_name: "Qwen3.8 Flash Next (Qwen4 Experimental)"
patterns:
  - qwen3.8-flash-next
  - qwen3_8_flash_next
  - qwen38-flash-next
  - qwen3.8 flash next
arch_fallback:
  - qwen4exp

# The supplied GGUF metadata is authoritative for this preview checkpoint:
# qwen4exp.context_length=262144, 48 blocks, and full attention every fourth
# block. Do not inherit the separate Qwen3.8 27B/2.4T profile's optional 1M
# YaRN claim until the Flash-Next model/runtime publishes that contract.
max_context: 262144
recommended_kv_quant: q5_0

rope_scale:
  enabled: false
  max_context: 262144
  scale_factor: 1.0

performance_target: throughput

# Metadata-embedded generation defaults.
sampling:
  chat:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja
  - --reasoning-preserve

# PLE is a model-native predictive head, not an ordinary external MTP GGUF.
# Keep generic n-gram speculation compatible without pretending current stock
# llama.cpp exposes PLE through --spec-type draft-mtp.
draft_max: 2
draft_p_min: 0.75
ngram_method: ngram-map-k4v

notes: >
  Dedicated profile for Qwen3.8-Flash-Next GGUFs declaring the experimental
  qwen4exp architecture. The supplied metadata describes a 48-block hybrid MoE
  with 512 experts, 10 active experts, full attention every fourth block (12
  context-growing KV layers), 262,144 native context, and a model-native PLE
  predictive head. Stock llama.cpp support was still tracked by upstream issue
  #27741 when this profile was added; the YAML supplies correct sizing, sampler,
  and template defaults but cannot add a missing qwen4exp loader. Select a
  llama.cpp build/fork that explicitly supports qwen4exp. PLE is intentionally
  not advertised as generic draft-mtp until upstream defines its runtime flags.
