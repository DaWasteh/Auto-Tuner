display_name: "dots.ocr (rednote-hilab)"
patterns:
  - dots.ocr
  - dots-ocr
  - dots_ocr
  - dotsocr

# generation_config.json: max_length 32768.
max_context: 32768
recommended_kv_quant: q8_0
performance_target: balanced
draft_max: 0

# dots_ocr/parser.py: temperature 0.1, top_p 1.0, no top_k or penalties.
sampling:
  chat:
    temperature: 0.1
    top_k: 0
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 0.1
    top_k: 0
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja

notes: >
  rednote-hilab dots.ocr: a 1.7B multilingual document parser on a Qwen2.5
  language model (architecture qwen2) with a NaViT vision encoder. Sampling
  follows the reference parser (temp 0.1 / top_p 1.0, no top_k, no repetition
  penalty); a repetition penalty would damage tables and repeated characters.
  The published window is 32,768 tokens. Use the official task prompts such
  as "Extract the text content from this image." for plain OCR; layout
  prompts return JSON with bounding boxes. AutoTuner attaches a compatible
  sibling mmproj when present.
