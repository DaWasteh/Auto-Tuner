display_name: "GLM-5 / 5.1 (Z.ai)"
patterns:
  - glm-5.1
  - glm-5
  - glm5

arch_fallback:
  - glm5

# Earlier GLM-5-family checkpoints expose roughly 200k native context.
# GLM-5.2 has its own 1M profile in glm-5_2.yaml.
max_context: 202752
recommended_kv_quant: q8_0
performance_target: throughput

sampling:
  chat:
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    min_p: 0.01
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 0.6
    top_k: 40
    top_p: 0.95
    min_p: 0.01
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja
  - --reasoning-preserve

notes: >
  Z.ai GLM-5/5.1 is a 744B-A40B MoE family for agentic coding and
  reasoning, with roughly 200k native context. Official chat sampling is
  temp 1.0 / top_p 0.95; coding uses the established deterministic temp 0.6
  local profile. --jinja and preserved reasoning are important for long tool
  workflows. GLM-5.2 is intentionally separate because it adds a 1M context,
  glm-dsa/IndexShare attention, an improved MTP layer, and a newer minimum
  llama.cpp build.
