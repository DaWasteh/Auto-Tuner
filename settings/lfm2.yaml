display_name: "LFM2 / LFM2.5 (LiquidAI)"
patterns:
  - lfm2
  - lfm-2

# LiquidAI LFM2 / LFM2.5 (general.architecture = "lfm2"). Kurz-Conv +
# GQA-Hybrid - in llama.cpp-Mainline unterstützt; seit Feb 2026 gibt es
# zusätzlich den LFM2-basierten Audio-Tokenizer für die Audio-Varianten.
# LFM2.5-Audio-1.5B meldet native_context = 128000 (wird via GGUF-Metadata
# gecappt - hier den nächstgrößeren Standardwert).
max_context: 131072
recommended_kv_quant: q8_0

# Sampling-Profile pro Modus.
sampling:
  chat:
    # LiquidAI's offizielle LFM2-Empfehlung: temp=0.3, min_p=0.15,
    # repetition_penalty=1.05. Die Modelle sind klein (1.2B/1.5B) und
    # neigen bei hoher Temperatur schnell zu Inkohärenz.
    temperature: 0.3
    top_k: 40
    top_p: 0.95
    min_p: 0.15
    repeat_penalty: 1.05
  coding:
    # Noch deterministischer für strukturierte/wiederholbare Ausgaben.
    temperature: 0.15
    top_k: 40
    top_p: 0.9
    min_p: 0.1
    repeat_penalty: 1.05

notes: >
  LiquidAI LFM2 / LFM2.5 edge family (short conv + GQA). Sampling follows
  LiquidAI's official recommendation (temp 0.3, min_p 0.15, rep 1.05): small
  models, hence a deliberately low temperature against incoherence. IMPORTANT
  (LFM2.5-Audio): this is an audio-in/audio-out speech model. This profile
  only provides sensible text-side defaults; the actual audio pipeline (audio
  encoder/decoder) runs through the dedicated llama.cpp audio paths, not
  through the plain text chat server. Loaded as a text chat model it works but
  produces no speech. LFM2 is technically a conv/attention hybrid; for this
  1.5B model the tuner's KV-cache overestimate is negligible (tiny model).
