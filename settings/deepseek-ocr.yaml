display_name: "DeepSeek OCR v1/v2"
patterns:
  - "deepseek-ocr-2"
  - "deepseek-ocr"
arch_fallback:
  - "deepseek2-ocr"

max_context: 16384
performance_target: "balanced"
recommended_kv_quant: "f16"
flash_attn: false
draft_max: 0

sampling:
  chat:
    temperature: 0.0
    top_k: 1
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 0.0
    top_k: 1
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - "--chat-template"
  - "deepseek-ocr"
  - "--no-jinja"
  - "--no-warmup"
  - "--dry-multiplier"
  - "0.8"
  - "--dry-base"
  - "1.75"
  - "--dry-allowed-length"
  - "2"
  - "--dry-penalty-last-n"
  - "64"
  - "--dry-sequence-breaker"
  - "none"

notes: >
  DeepSeek-OCR v1/v2 document model. The verified prompt is "Free OCR.";
  Unlimited-OCR is a distinct checkpoint with the same GGUF architecture and
  uses its own name-matched profile and "document parsing." prompt.
