display_name: "Ling 3.0 (InclusionAI, BailingMoE3)"
patterns:
  - ling-3.0-flash
  - ling3.0-flash
  - ling-3-flash
  - ling3-flash
  - ling-3.0-tiny
  - ling3.0-tiny
  - bailingmoe3

# b10460 introduced the dedicated bailingmoe3 architecture. Keep this separate
# from Ling 2.6's bailingmoe2.5/bailing_hybrid fork profile.
arch_fallback:
  - bailingmoe3

max_context: 262144
recommended_kv_quant: q8_0
performance_target: throughput
min_llama_build: 10749

sampling:
  chat:
    temperature: 0.6
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 0.6
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja
  - --reasoning-preserve

draft_max: 3
draft_p_min: 0.75
ngram_method: ngram-map-k4v

notes: >
  InclusionAI Ling 3.0 uses the bailingmoe3 hybrid KDA/MLA MoE architecture.
  Flash is 124B-A5.1B with 256k context; Tiny is the smaller 7.9B-A1.3B
  sibling. Official sampling is temp 0.6 / top_p 0.95 / top_k 20 with
  thinking enabled. llama.cpp b10460 added conversion, inference, integrated
  and separate NEXTN/MTP support; this profile requires b10749 because that is
  the first tagged build with corrected no-scan BailingMoE3 SSM state tensors.
  Compatible MTP weights
  can use up to three speculative tokens. Do not route these checkpoints
  through the older Ling 2.6 bailingmoe2.5/bailing_hybrid fork profile.
