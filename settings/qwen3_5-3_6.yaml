display_name: "Qwen3.5 / Qwen3.6 (Alibaba)"
patterns:
  - qwen3.5
  - qwen3.6
  # Community-Finetunes auf Qwen3.5/3.6-Basis, deren Dateiname NICHT
  # "qwen3.5"/"qwen3.6" enthält. Beide nutzen laut Modell-Card explizit
  # die offiziellen Qwen3.5-Sampling-Settings (temp 1.0 / top_p 0.95 /
  # top_k 20, <think>-Reasoning), also exakt dieses Profil — daher hier
  # als Pattern statt als separate (identische) YAML:
  #   - Qwable  (empero-ai / Mia-AiLab): Qwen3.5-9B / Qwen3.6-35B SFT-Distill,
  #     "run against the final checkpoint using Qwen3.5's recommended
  #     sampling settings". 35B-Variante arch=qwen35moe, 9B/27B arch=qwen35.
  #   - Qwopus  (Jackrong): Qwen3.5-9B Claude-Opus/GLM-Reasoning-Distill,
  #     Bench-Setup temp=1.0 top_p=0.95, MTP n=2. arch=qwen35.
  - qwable
  - qwopus

# Architektur-Fallback: fängt Qwen3.5/3.6-Re-Quants/Merges mit
# unüblichen Dateinamen, die oben KEIN Pattern treffen. Gematcht wird
# exakt gegen general.architecture. qwen35 = dense (9B/27B), qwen35moe =
# A3B/A10B-MoE — beide sind dieselbe Qwen3.5/3.6-Familie und sollen dieses
# Profil (inkl. der korrekten Sampling-Defaults) statt _default bekommen.
# Filename-Pattern haben weiterhin Vorrang; das hier greift nur im
# "kein Pattern hat gematcht"-Fall.
arch_fallback:
  - qwen35
  - qwen35moe

# Qwen3.5 (Feb 2026): 0.8B/2B/4B/9B/27B/35B-A3B/122B-A10B/397B-A17B.
# Qwen3.6 (April 2026): erste Open-Weights 27B + 35B-A3B.
# Native 262144 (256k), erweiterbar via YaRN bis ~1.01M Tokens.
# HF-Card Qwen3.6: "Context Length: 262,144 natively and extensible up
# to 1,010,000 tokens" - daher hier den größten nativen Wert.
max_context: 262144
# KV-Quant-Empfehlung: q5_0 (asymmetrisch mit cv=q4_0 wenn der Tuner Platz
# sucht) ist für die A3B/A10B/A17B-MoE-Varianten der Sweet-Spot. Q8_0 wäre
# qualitativ marginal besser, kostet aber +37% KV-VRAM gegenüber q5_0
# (Faktoren 0.55 vs 0.40 von f16) — auf 16-GB-Klassen-GPUs landet damit
# ein Expert-Layer extra auf der CPU statt im VRAM, was die TG-Speed
# spürbar drückt. Wer für reine 27B-Dense-Sessions q8_0 will, kann es im
# Expert-Panel manuell pinnen — die Cascade rechnet den ctx dann
# automatisch entsprechend kleiner.
recommended_kv_quant: q5_0

# RoPE-Scaling (YaRN): Optional aktivierbar wenn genügend Speicher frei ist
# und der berechnete Context das native Limit überschreitet.
rope_scale:
  enabled: false        # Standard aus — User kann in GUI aktivieren
  max_context: 1010000  # ~1M tokens mit YaRN möglich (offiziell 1,010,000)
  scale_factor: 4.0     # YaRN scaling factor (4x für Qwen3.5/3.6)

# Performance-Target-Empfehlung des Profils.
# Qwen3.6-A3B ist ein MoE-Modell, das auf 16-GB-GPUs nicht voll in VRAM
# passt — der Trick ist, möglichst viele Expert-Layer auf der GPU zu
# halten und die nicht-aktiven Experten via --n-cpu-moe in den RAM
# auszulagern. "throughput" reserviert nur 32k KV-Budget statt 64k oder
# 128k, sodass mehr VRAM für Layer übrig bleibt. Wer regelmäßig >32k
# Kontext braucht, in der GUI auf "balanced" oder "safe" wechseln —
# die GUI-Wahl gewinnt immer gegen diese Empfehlung.
performance_target: throughput

# Sampling-Profile pro Modus.
sampling:
  chat:
    # Qwen3.5/3.6 Default ist Thinking-Modus. Werte sind die offiziellen
    # "Thinking general"-Settings aus den HF-Modell-Cards
    # (Bench-Setup für SWE-Bench: temp=1.0, top_p=0.95, top_k=20).
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0     # Qwen empfiehlt explizit 1.0
    # Qwen empfiehlt presence_penalty: 1.5 *für Chat*. Beim Tool-Calling und
    # strukturierter Ausgabe ist das eine bekannte Loop-Quelle: das Modell
    # muss in jedem Tool-Call exakt dieselben Tokens emittieren (gleiche
    # JSON-Keys, gleiche Tool-Namen), und ein presence_penalty von 1.5
    # bestraft genau diese Wiederholungen → kaputtes JSON → Client meldet
    # Fehler → Modell "kreativiert" → Schleife.
    # Default daher konservativ auf 0.0. Wer reine Chat-Konversation ohne
    # Tools fährt und Wiederholungen sieht, kann beim Start überschreiben:
    #   -- --presence-penalty 1.5
    presence_penalty: 0.0
  coding:
    # Aus dem offiziellen QwenClawBench-Setup (HF-Card Qwen3.6-35B-A3B):
    # "QwenClawBench: temp=0.6, 256K ctx" - das ist der von Alibaba selbst
    # für agentische Coding-Tasks verwendete Wert.
    temperature: 0.6
    top_k: 20
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

# MTP / speculative decoding configuration.
# draft_max = max draft tokens per step.
#   2 ist der Sweet-Spot für Vulkan/ROCm auf Consumer-GPUs: Token 1 hat
#   ~85–90% Acceptance wenn p_min=0.75 greift (Qwen3.6 zeigt ~83% lt.
#   Community-Benchmarks); Token 3 würde nur ~61% (0.85^3) bringen und
#   der Extra-Kernel-Overhead auf Vulkan überwiegt den Gewinn. CUDA-User
#   können 3–5 via Expert-Panel testen — auf AMD/Vulkan ist 2 die Grenze.
#   Für MoE-Varianten (35B-A3B): ebenfalls 2, da die spärlichere Aktivierung
#   die Acceptance-Rate leicht senkt und das Overhead-Verhältnis ungünstiger ist.
# draft_p_min = minimum confidence threshold for speculation.
#   0.75 = mainline default (b9190+). Nur spekulieren wenn der Draft-Head
#   hinreichend sicher ist — verhindert konstanten D2H-Overhead auf
#   Vulkan/ROCm wenn das Modell unsicher ist.
draft_max: 2
draft_p_min: 0.75


notes: >
  Qwen3.5 (February 2026) and Qwen3.6 (April 2026) are thinking-by-default
  multimodal models with 256k native context (extendable to 1.01M via YaRN).
  The original Qwen3 has only 32k and is automatically limited through the
  GGUF native_context. The chat profile corresponds to the official thinking
  setup; the coding profile mirrors the official QwenClawBench setting
  (temp=0.6). presence_penalty is set to 0.0 here instead of the official Qwen
  recommendation of 1.5 because 1.5 reproducibly causes tool-calling loops
  (structured output needs repeated tokens, which a high presence_penalty
  punishes). For pure chat without tools: `-- --presence-penalty 1.5`. New in
  Qwen3.6: the `preserve_thinking` API flag keeps thinking content across
  multi-turn conversations for better agentic consistency. Tip: `--jinja` as
  an extra arg at start enables the clean separation of <think> blocks into
  the reasoning_content API field (instead of leaving them inline in content):
  -- --jinja
