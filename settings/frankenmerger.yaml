display_name: "Frankenmerger / community merge"
patterns:
  - archon
  - eclectic-maid
  - voldemort
  - tutorai
  - nsfw-merge
  - frankenmerg

max_context: 16384
recommended_kv_quant: q8_0

# Sampling-Profile pro Modus.
sampling:
  chat:
    # Frankenmerges sind primär Roleplay/Creative-Writing-Modelle.
    # Höhere Temperature für mehr Kreativität.
    temperature: 0.85
    top_k: 50
    top_p: 0.95
    min_p: 0.03
    repeat_penalty: 1.1
  coding:
    # Diese Merges sind nicht für Code optimiert - aber für den Fall,
    # dass jemand sie trotzdem für Code nutzen will, ein deutlich
    # konservativeres Profil. Höher als 0.15 (typisch für Coder) weil
    # Merges bei sehr niedriger Temp oft kohärenz-verlieren.
    temperature: 0.4
    top_k: 50
    top_p: 0.9
    min_p: 0.03
    repeat_penalty: 1.1

notes: >
  Merges often have inconsistent context limits and sampling sweet spots. The
  chat profile is optimised for roleplay/creative writing (higher temperature,
  stronger repeat penalty against loops in long RP sessions). The coding
  profile is defensive: these models are not primarily trained for code; if
  code performance is poor, prefer a dedicated coder profile.
