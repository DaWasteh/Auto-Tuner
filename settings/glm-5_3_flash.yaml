display_name: "GLM-5.3-Flash (Z.ai, multimodal KDA/DSA hybrid)"
patterns:
  - glm-5.3-flash
  - glm5.3-flash
  - glm-5_3-flash
  - glm5_3_flash
  - glm53-flash

# Current community converters converge on "glm5next"; one competing
# implementation used "glm5-next". Keep both exact fallbacks while upstream
# support is still under review.
arch_fallback:
  - glm5next
  - glm5-next

# Current patched runtimes have a validated CUDA ceiling near 262k. Keep the
# native 1M fact in the notes, but do not let automatic planning exceed the
# currently demonstrated implementation contract.
max_context: 262140
required_runtime_markers:
  - glm5next
recommended_kv_quant: q8_0
performance_target: throughput

# Official zai-org generation_config.json.
sampling:
  chat:
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    min_p: 0.01
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 1.0
    top_k: 40
    top_p: 0.95
    min_p: 0.01
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja
  - --reasoning-preserve

# One native NextN layer is present. The text-only development branch has
# measured 51-67% acceptance with three-token drafts; ngram-map-k4v is the
# llama.cpp method that can coexist with draft-mtp.
draft_max: 3
draft_p_min: 0.75
ngram_method: ngram-map-k4v

notes: >
  Z.ai GLM-5.3-Flash is a natively multimodal 320B-A18B MoE with 45 layers:
  34 KDA linear-attention layers plus 11 pooled DSA/MLA layers, mHC residual
  streams, 288 routed experts (top-8) + 1 shared expert, one NextN/MTP layer,
  and native 1M context. Official sampling is temp=1.0 / top_p=0.95; the
  embedded template supports low/high/max reasoning effort and defaults to
  max. IMPORTANT: as of 2026-08-30, glm5next support is still in open upstream
  llama.cpp PRs #27752 (text + experimental MTP) and #27773 (text + vision);
  stock mainline does not load the architecture yet. Use a matching patched
  build and GGUF conversion. The implementations have different current
  trade-offs: one omits vision, the other keeps MTP for a separate PR, and
  multiple sequences require unified KV handling. Published Unsloth GGUFs use
  general.architecture=glm5next and offer separate mmproj files. Prefer IQ3 or
  higher: real Metal/CPU testing reported repeated-token failure for UD-IQ1_M
  while IQ3_XXS and IQ4_XS remained coherent. Current development CUDA also
  has a reported DSA-pool ceiling near 262k context, so AutoTuner caps this
  preview profile at 262,140 despite the model's native 1M metadata. Raise that
  cap only after the selected runtime fixes and validates the full window.
