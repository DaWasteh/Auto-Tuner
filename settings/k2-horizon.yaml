display_name: "K2 Horizon (IFM fork)"
patterns:
  - k2-horizon-mova
  - k2_horizon_mova
  - k2-horizon-36b
  - k2_horizon_36b
  - k2-horizon
  - k2_horizon
arch_fallback:
  - k2-horizon
# Not Kimi-K2/deepseek2! No numeric mainline build currently loads this arch.
# Capability checking inspects the selected executable and sibling libllama.
required_runtime_markers:
  - k2-horizon
max_context: 524288
recommended_kv_quant: q8_0
sampling:
  chat:
    temperature: 1.0
    top_k: 0
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
  coding:
    temperature: 1.0
    top_k: 0
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
extra_args:
  - --jinja
  - --chat-template-kwargs
  - '{"reasoning_effort":"high","tool_call_format":"xml"}'
draft_max: 2
draft_p_min: 0.75
ngram_method: ngram-mod
notes: >
  IFM K2 Horizon MoVA is NOT Moonshot Kimi-K2. Mainline llama.cpp b10863 lacks
  k2-horizon; select a compatible MBZUAI-IFM/llama.cpp model/K2Horizon build.
  The 36B-A4B checkpoint has 48 full-attention layers, 100 FFN experts (8
  active), 64 value experts (4 active), three leading dense layers and native
  524,288-token context. MoVA combines values before caching: do not multiply
  KV by the value-expert count. Auto uses whole-layer offload rather than the
  generic 8%-shared FFN-only estimate, which undercounts MoVA attention weights.
  Use the GGUF's embedded template; high reasoning and XML tools are the
  author's defaults. No vision, MTP or RoPE extension is assumed. Fork inference
  and tool-parser correctness are not hardware-validated by AutoTuner. Sources:
  https://huggingface.co/IFM/K2-Horizon-MoVA-36B-A4B-GGUF and
  https://github.com/MBZUAI-IFM/llama.cpp/tree/model/K2Horizon.
