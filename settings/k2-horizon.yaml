display_name: "K2 Horizon (IFM)"
patterns:
  - k2-horizon-mova
  - k2_horizon_mova
  - k2-horizon-36b
  - k2_horizon_36b
  - k2-horizon
  - k2_horizon
arch_fallback:
  - k2-horizon
# Not Kimi-K2/deepseek2! Mainline llama.cpp loads this arch since b11454
# (PR #29535, dense and MoVA); the MBZUAI-IFM fork reports its own build
# number, so capability checking inspects the selected executable and sibling
# libllama for the architecture string instead of a numeric floor.
required_runtime_markers:
  - k2-horizon
max_context: 524288
recommended_kv_quant: q8_0
sampling:
  chat:
    temperature: 1.0
    top_k: 0
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
  coding:
    temperature: 1.0
    top_k: 0
    top_p: 0.95
    min_p: 0.0
    repeat_penalty: 1.0
extra_args:
  - --jinja
  - --chat-template-kwargs
  - '{"reasoning_effort":"high","tool_call_format":"xml"}'
draft_max: 2
draft_p_min: 0.75
ngram_method: ngram-mod
notes: >
  IFM K2 Horizon is NOT Moonshot Kimi-K2. Mainline llama.cpp b11454+ (PR
  #29535) loads the dense models and MoVA-36B-A4B with a dedicated chat
  parser; the MBZUAI-IFM model/K2Horizon fork works as well. MoVA-36B-A4B has
  48 full-attention layers, 100 FFN experts (8 active), 64 value experts (4
  active), three leading dense layers and native 524,288-token context. MoVA
  combines values before caching: KV is not multiplied by the value-expert
  count. --n-cpu-moe does not move the value experts, so Auto uses whole-layer
  offload instead of the FFN-only expert estimate. Use the GGUF's embedded
  template; high reasoning and XML tools are the author's defaults. No vision,
  MTP or RoPE extension. Sources:
  https://huggingface.co/IFM/K2-Horizon-MoVA-36B-A4B-GGUF and llama.cpp PR
  #29535.
