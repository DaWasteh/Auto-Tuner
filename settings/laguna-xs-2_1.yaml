display_name: "Laguna XS 2.1 (Poolside, agentic coding MoE)"
patterns:
  - laguna-xs-2.1
  - laguna-xs2.1
  - laguna_xs_2.1
  - laguna-xs-2_1
  - laguna-xs.2
  - laguna-xs-2

# b11598 (PR #30331) liest laguna.rope.scaling.yarn_beta_fast; XS 2.1
# speichert 64 statt der früher fest angenommenen 32.
min_llama_build: 11598

max_context: 262144
recommended_kv_quant: q8_0
performance_target: throughput

# Poolside: temperature 1.0, top_k 20, top_p 1.0 (Benchmarks und
# generation_config), Thinking standardmäßig an.
sampling:
  chat:
    temperature: 1.0
    top_k: 20
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0
  coding:
    temperature: 1.0
    top_k: 20
    top_p: 1.0
    min_p: 0.0
    repeat_penalty: 1.0
    presence_penalty: 0.0

extra_args:
  - --jinja
  - --reasoning-preserve

# Der DFlash-Speculator schlägt bis zu 7 Tokens pro Schritt vor.
draft_max: 7

notes: >
  Laguna XS 2.1 (Poolside) is a text-only 33B-A3B MoE for agentic coding and
  long-horizon work with interleaved, preserved thinking and 262,144 tokens
  of context. Use llama.cpp b11598+ (PR #30331): XS 2.1 stores YaRN
  beta_fast 64, which older builds ignored in favour of 32. Thinking is on by
  default and can be disabled per request with enable_thinking. Poolside's
  DFlash speculator (Laguna-XS-2.1-DFlash, up to 7 draft tokens) pairs
  automatically when a GGUF of it is present. Official sampling:
  temperature 1.0, top-k 20, top-p 1.0. The predecessor Laguna XS.2 uses
  the same profile.
