display_name: "Llama 3.x (Meta)"
patterns:
  - llama-3

max_context: 131072
recommended_kv_quant: q8_0

# Sampling-Profile pro Modus.
sampling:
  chat:
    temperature: 0.75
    top_k: 40
    top_p: 0.95
    min_p: 0.05
    repeat_penalty: 1.05
  coding:
    # Meta nennt für Code-Tasks keine offiziellen Werte, aber
    # 0.2 ist der Community-Konsens für Llama-basierte Code-Workflows.
    temperature: 0.2
    top_k: 40
    top_p: 0.9
    min_p: 0.05
    repeat_penalty: 1.05

notes: >
  Standard profile for Meta's Llama 3 series. Llama 3.1+ natively supports
  128k context; older and smaller variants are limited to their real limit
  through GGUF metadata. Llama 4 has its own profile because of its different
  official sampling and 1M/10M context limits. Chat is the all-round default;
  coding is strongly deterministic.
